name: myacademy_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  shared_preferences: ^2.5.5
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  path: ^1.9.1
  connectivity_plus: ^7.0.0
  
  # Animation packages
  lottie: ^3.1.2
  rive: ^0.13.13
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2
  flutter_staggered_animations: ^1.1.1
  page_transition: ^2.1.0
  smooth_page_indicator: ^1.2.0+3
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/lottie/
