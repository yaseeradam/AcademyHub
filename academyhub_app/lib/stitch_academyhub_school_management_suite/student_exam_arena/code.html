<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary/30 selection:text-primary-fixed">
<!-- Lockdown Banner -->
<div class="w-full bg-error-container text-on-error-container py-base flex items-center justify-center gap-2 font-label-md text-label-md shadow-sm z-[70] relative">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span>Secure Exam Mode Active</span>
</div>
<!-- Sticky Exam Header -->
<header class="sticky top-0 w-full z-[60] bg-surface-container/90 backdrop-blur-md border-b border-outline-variant/20 px-gutter md:px-container-padding py-stack-sm flex flex-col md:flex-row md:items-center justify-between gap-stack-sm shadow-lg">
<!-- Exam Info -->
<div class="flex flex-col">
<h1 class="font-title-lg text-title-lg text-on-surface">Biology Mid-Term</h1>
<p class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">school</span>
                Advanced Cell Structures
            </p>
</div>
<!-- Progress & Timer -->
<div class="flex items-center justify-between md:justify-end gap-stack-md w-full md:w-auto">
<!-- Progress -->
<div class="flex flex-col items-start md:items-end">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Progress</span>
<span class="font-title-lg text-title-lg text-on-surface font-bold">12 <span class="text-on-surface-variant font-normal text-body-md">/ 40</span></span>
</div>
<!-- Timer (Critical Status) -->
<div class="flex items-center gap-base bg-surface-container-highest border border-error/30 rounded-xl px-4 py-2">
<span class="material-symbols-outlined text-error animate-pulse" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="font-headline-md text-headline-md text-error tracking-tight font-mono">45:12</span>
</div>
</div>
<!-- Background Progress Bar Line -->
<div class="absolute bottom-0 left-0 h-1 bg-surface-container-highest w-full">
<div class="h-full bg-primary" style="width: 30%;"></div>
</div>
</header>
<!-- Main Content Arena -->
<main class="flex-grow flex flex-col items-center justify-start pt-section-gap pb-[120px] px-gutter md:px-container-padding">
<!-- Primary Question Card (Interpreting "White Card" in Dark Mode context as primary elevated surface) -->
<div class="w-full max-w-4xl bg-surface-container-low rounded-[24px] border border-outline-variant/10 shadow-2xl p-container-padding md:p-section-gap flex flex-col gap-section-gap relative overflow-hidden">
<!-- Subtle Top Gradient for Depth -->
<div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-surface-container-highest/20 to-transparent pointer-events-none"></div>
<!-- Question Area -->
<div class="flex flex-col gap-stack-sm relative z-10">
<div class="flex items-center gap-2 mb-2">
<span class="bg-surface-container-highest text-on-surface-variant px-3 py-1 rounded-full font-label-sm text-label-sm">Question 12</span>
<span class="bg-tertiary-container/20 text-tertiary px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">psychology</span> 2 Points
                    </span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface leading-snug">
                    Which cellular organelle is primarily responsible for the production of adenosine triphosphate (ATP) through the process of cellular respiration?
                </h2>
<!-- Optional Image Placeholder for Context -->
<div class="w-full h-48 md:h-64 bg-cover bg-center rounded-xl border border-outline-variant/10 mt-4 opacity-80 mix-blend-luminosity hover:mix-blend-normal transition-all duration-500" data-alt="A highly detailed microscopic view of a cell interior, emphasizing complex organelle structures glowing faintly against a deep, dark scientific background, illustrating biological complexity in a modern educational aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCCqUJkxAHr4lGIbPuEY6DcnGjl6AQBAFlGBPwGsffB3TPdiqUbl-ITd_VC1bU4sA9WXj7nj0KFsn1cDF9r8vLiyM5ieXpBMC7-7EEnLSUJaLpQVksLDknLqnvhBcgPtnZf43qCW_L0vNAH_gvcVvexE7rfXqJOtRTWhtFdX1IrU_BNK8u1kazIsLJFFjpXuvVn4Vx6AKqwZuMkIKHh6Ct1m9lJq3s9Vj-EAmg8hMZ8lWroOX18KK4bQoZDXf5dDODnDNQ3QPAt7Z8')"></div>
</div>
<!-- Multiple Choice Options (Pills) -->
<div class="flex flex-col gap-stack-sm relative z-10">
<!-- Option A (Unselected) -->
<button class="w-full text-left group flex items-center p-4 rounded-xl border border-outline-variant/30 bg-surface-container hover:bg-surface-container-highest hover:border-outline-variant transition-all duration-200">
<div class="flex-shrink-0 w-10 h-10 rounded-full border border-outline-variant/50 flex items-center justify-center mr-4 group-hover:bg-surface-bright transition-colors">
<span class="font-label-md text-label-md text-on-surface-variant">A</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface-variant group-hover:text-on-surface transition-colors">Golgi Apparatus</span>
</button>
<!-- Option B (Selected - Amber Tint) -->
<button class="w-full text-left flex items-center p-4 rounded-xl border-2 border-primary bg-primary/10 shadow-[0_0_15px_rgba(255,193,116,0.1)] transition-all duration-200 relative overflow-hidden">

<div class="absolute inset-0 bg-primary/5 blur-xl pointer-events-none"></div>
<div class="flex-shrink-0 w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center mr-4 relative z-10">
<span class="font-label-md text-label-md">B</span>
</div>
<span class="font-body-lg text-body-lg text-primary-fixed-dim font-medium flex-grow relative z-10">Mitochondria</span>
<span class="material-symbols-outlined text-primary ml-auto relative z-10" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option C (Unselected) -->

<div class="flex-shrink-0 w-10 h-10 rounded-full border border-outline-variant/50 flex items-center justify-center mr-4 group-hover:bg-surface-bright transition-colors">
<span class="font-label-md text-label-md text-on-surface-variant">C</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface-variant group-hover:text-on-surface transition-colors">Endoplasmic Reticulum</span>

</div>
</div>

<div class="flex items-center gap-stack-sm">
<button class="flex items-center gap-2 px-4 py-3 min-h-[48px] rounded-full border border-outline-variant/30 text-on-surface-variant hover:bg-surface-container-highest hover:text-on-surface transition-colors font-label-md text-label-md">
<span class="material-symbols-outlined text-[20px]">chevron_left</span>
<span class="hidden md:inline">Previous</span>
</button>
<button class="flex items-center gap-2 px-6 py-3 min-h-[48px] rounded-full bg-surface-bright text-on-surface hover:bg-surface-container-highest transition-colors font-label-md text-label-md">

<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</button>
</div>
