<script>
document.addEventListener('DOMContentLoaded', function() {
    // Manual button click handler as fallback
    const createButton = document.querySelector('button[wire\\:click="openCreateModal"]');
    if (createButton) {
        createButton.addEventListener('click', function(e) {
            console.log('Manual click handler triggered');
            
            // Show modal manually if Livewire fails
            const modal = document.querySelector('.fixed.inset-0.z-50');
            if (modal) {
                modal.style.display = 'flex';
            } else {
                // Create modal manually
                const modalHTML = `
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full">
                            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 p-6 rounded-t-2xl">
                                <h3 class="text-xl font-bold text-white">Create Parent Account</h3>
                            </div>
                            <div class="p-6 space-y-4">
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                                    <input type="text" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" placeholder="Enter parent's full name" />
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                                    <input type="email" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" placeholder="Enter email address" />
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                                    <input type="password" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" placeholder="Enter password" />
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number (Optional)</label>
                                    <input type="text" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm" placeholder="Enter phone number" />
                                </div>
                            </div>
                            <div class="p-6 pt-0 flex gap-3">
                                <button onclick="alert('Create functionality needs backend integration')" class="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-amber-500 px-5 py-2.5 text-sm font-bold text-white">
                                    Create Account
                                </button>
                                <button onclick="this.closest('.fixed').remove()" class="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-white px-5 py-2.5 text-sm font-bold text-slate-700 ring-1 ring-slate-200">
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHTML);
            }
        });
    }
});
</script>
