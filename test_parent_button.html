<!DOCTYPE html>
<html>
<head>
    <title>Test Parent Button</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body>
    <div x-data="{ showModal: false }">
        <button @click="showModal = true" class="bg-blue-500 text-white px-4 py-2 rounded">
            Create Parent Account
        </button>
        
        <div x-show="showModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
            <div class="bg-white p-6 rounded">
                <h3>Create Parent Modal</h3>
                <button @click="showModal = false" class="bg-red-500 text-white px-4 py-2 rounded mt-4">
                    Close
                </button>
            </div>
        </div>
    </div>
</body>
</html>
