<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Too Large - AcademyHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="flex h-full flex-col bg-slate-50 text-slate-800 antialiased dark:bg-slate-900 dark:text-slate-200">
    <div class="flex flex-1 flex-col items-center justify-center p-6 text-center">
        <div class="relative flex h-24 w-24 items-center justify-center rounded-3xl bg-orange-100 text-orange-600 dark:bg-orange-950/50 dark:text-orange-400">
            <svg class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
            <span class="absolute -top-1 -right-1 flex h-4 w-4">
                <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-orange-400 opacity-75"></span>
                <span class="relative inline-flex h-4 w-4 rounded-full bg-orange-500"></span>
            </span>
        </div>

        <h1 class="mt-6 text-2xl font-bold tracking-tight text-slate-950 dark:text-white sm:text-3xl">
            Upload Size Exceeded
        </h1>
        
        <p class="mt-3 max-w-md text-sm text-slate-600 dark:text-slate-400">
            The file you tried to upload is too large and was blocked. 
            For security and performance, uploads are limited to a maximum of <span class="font-semibold text-slate-900 dark:text-white">5 MB</span> for profile photos.
        </p>

        <div class="mt-8 flex flex-col gap-3 sm:flex-row">
            <button onclick="window.history.back()" class="inline-flex items-center justify-center rounded-2xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition duration-200">
                <svg class="mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
                Go Back & Try Again
            </button>
            <a href="/dashboard" class="inline-flex items-center justify-center rounded-2xl bg-white px-5 py-3 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 dark:bg-slate-800 dark:text-slate-200 dark:ring-slate-700 dark:hover:bg-slate-700 transition duration-200">
                Back to Dashboard
            </a>
        </div>
    </div>

    <footer class="py-6 text-center text-xs text-slate-400 dark:text-slate-600">
        &copy; 2026 AcademyHub. All rights reserved.
    </footer>
</body>
</html>
