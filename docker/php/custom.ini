; =============================================================================
; AcademyHub - Custom PHP Configuration
; =============================================================================

; Upload limits (student photos, homework files, spreadsheet imports)
upload_max_filesize = 50M
post_max_size = 55M

; Memory for report card generation, spreadsheet processing
memory_limit = 512M

; Execution time for bulk operations (report cards, imports, CBT)
max_execution_time = 300
max_input_time = 300

; OPcache for production performance
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.enable_file_override = 1

; Session
session.gc_maxlifetime = 7200

; Timezone
date.timezone = Africa/Lagos

; Error handling (production)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-errors.log
