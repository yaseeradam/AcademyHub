# =============================================================================
# AcademyHub - Docker Compose
# Production-ready setup: App (PHP+Nginx) + MySQL + Redis
# Works both offline (local LAN) and online (cloud VPS)
# =============================================================================

services:
  # ── Application (PHP-FPM + Nginx) ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academyhub-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      # Persist uploads, avatars, certificates, report cards
      - uploads:/var/www/html/public/uploads
      - avatars:/var/www/html/public/avatars
      - certificates:/var/www/html/public/certificates
      - report-cards:/var/www/html/public/report-cards-export
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    environment:
      - APP_NAME=${APP_NAME:-AcademyHub}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-academyhub}
      - DB_USERNAME=${DB_USERNAME:-academyhub}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_DRIVER=${CACHE_DRIVER:-redis}
      - SESSION_DRIVER=${SESSION_DRIVER:-redis}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYACADEMY_SCHOOL_NAME=${MYACADEMY_SCHOOL_NAME:-My School}
      - MYACADEMY_ADMIN_EMAIL=${MYACADEMY_ADMIN_EMAIL:-admin@school.com}
      - MYACADEMY_ADMIN_PASSWORD=${MYACADEMY_ADMIN_PASSWORD:-changeme}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - academyhub

  # ── MySQL Database ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: academyhub-db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-academyhub}
      - MYSQL_USER=${DB_USERNAME:-academyhub}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - academyhub

  # ── Redis Cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: academyhub-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - academyhub

# ── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
  uploads:
    driver: local
  avatars:
    driver: local
  certificates:
    driver: local
  report-cards:
    driver: local
  storage:
    driver: local
  logs:
    driver: local

# ── Network ────────────────────────────────────────────────────────────────
networks:
  academyhub:
    driver: bridge
