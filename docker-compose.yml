# =============================================================================
# AcademyHub - Docker Compose
# Production-ready setup: App (PHP+Nginx) + MySQL + Redis
# Works both offline (local LAN) and online (cloud VPS)
# =============================================================================

services:
  # ── Application (PHP-FPM + Nginx) ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academyhub-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      # Persist uploads, avatars, certificates, report cards
      - uploads:/var/www/html/public/uploads
      - avatars:/var/www/html/public/avatars
      - certificates:/var/www/html/public/certificates
      - report-cards:/var/www/html/public/report-cards-export
      - storage:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    environment:
      - APP_NAME=${APP_NAME:-AcademyHub}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-academyhub}
      - DB_USERNAME=${DB_USERNAME:-academyhub}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_DRIVER=${CACHE_DRIVER:-redis}
      - SESSION_DRIVER=${SESSION_DRIVER:-redis}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ACADEMYHUB_SCHOOL_NAME=${ACADEMYHUB_SCHOOL_NAME:-My School}
      - ACADEMYHUB_ADMIN_EMAIL=${ACADEMYHUB_ADMIN_EMAIL:-admin@school.com}
      - ACADEMYHUB_ADMIN_PASSWORD=${ACADEMYHUB_ADMIN_PASSWORD:-changeme}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - BROADCAST_DRIVER=${BROADCAST_DRIVER:-reverb}
      - REVERB_APP_ID=${REVERB_APP_ID:-academyhub}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-academyhub-reverb-key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-academyhub-reverb-secret}
      - REVERB_HOST=${REVERB_HOST:-localhost}
      - REVERB_PORT=${REVERB_PORT:-8080}
      - REVERB_SCHEME=${REVERB_SCHEME:-http}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-evolution}
      - WHATSAPP_EVOLUTION_URL=${WHATSAPP_EVOLUTION_URL:-http://whatsapp:8080}
      - WHATSAPP_EVOLUTION_KEY=${WHATSAPP_EVOLUTION_KEY:-academyhub-wa-secret-key}
      - WHATSAPP_EVOLUTION_INSTANCE=${WHATSAPP_EVOLUTION_INSTANCE:-academyhub}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - academyhub

  # ── MySQL Database ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: academyhub-db
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-academyhub}
      - MYSQL_USER=${DB_USERNAME:-academyhub}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - academyhub

  # ── Redis Cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: academyhub-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - academyhub

  # ── WhatsApp Gateway (Evolution API - Free Multi-Device QR Pairing) ──────
  whatsapp:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: academyhub-whatsapp
    restart: unless-stopped
    ports:
      - "${WHATSAPP_PORT:-8085}:8080"
    environment:
      - SERVER_URL=http://localhost:${WHATSAPP_PORT:-8085}
      - AUTHENTICATION_API_KEY=${WHATSAPP_EVOLUTION_KEY:-academyhub-wa-secret-key}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/3
      - CACHE_REDIS_PREFIX_KEY=evolution
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=mysql
      - DATABASE_CONNECTION_URI=mysql://${DB_USERNAME:-academyhub}:${DB_PASSWORD:-secret}@db:3306/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - WEBHOOK_GLOBAL_URL=http://app/api/whatsapp/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - CONFIG_SESSION_PHONE_CLIENT=AcademyHub
      - QRCODE_LIMIT=30
    volumes:
      - whatsapp_instances:/evolution/instances
    depends_on:
      - redis
      - db
    networks:
      - academyhub

# ── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
  uploads:
    driver: local
  avatars:
    driver: local
  certificates:
    driver: local
  report-cards:
    driver: local
  whatsapp_instances:
    driver: local
  storage:
    driver: local
  logs:
    driver: local

# ── Network ────────────────────────────────────────────────────────────────
networks:
  academyhub:
    driver: bridge
